# .github/workflows/update-readme.yml
# Auto-refreshes the Ph4wkm00n profile README on a schedule.
# Place inside the special profile repo: Ph4wkm00n/Ph4wkm00n
#
# Required repo secrets (Settings → Secrets → Actions):
#   GH_TOKEN — a Personal Access Token with `repo` + `read:user` scopes

name: 🦅 Update Profile README

on:
  schedule:
    - cron: "0 3 * * *"      # runs daily at 03:00 UTC (low-traffic window)
  push:
    branches: [main]          # also refresh on every push to main
  workflow_dispatch:           # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  # ── 1. Refresh snake contribution graph ─────────────────────────────────────
  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Ph4wkm00n
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Push snake output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # ── 2. Refresh dynamic README sections ──────────────────────────────────────
  readme:
    name: Refresh README stats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dateutil

      - name: Update README timestamps
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import re, datetime, pathlib

          readme = pathlib.Path("README.md")
          content = readme.read_text()

          # Stamp a "Last synced" line if the placeholder exists
          now = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")
          content = re.sub(
              r"<!-- LAST_SYNC:.*?-->",
              f"<!-- LAST_SYNC:{now} -->",
              content,
          )
          readme.write_text(content)
          print(f"README stamped: {now}")
          EOF

      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-sync profile README [skip ci]"
          git push

  # ── 3. Lint & validate Markdown ─────────────────────────────────────────────
  lint:
    name: Lint README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "README.md"
          config: |
            {
              "MD013": false,
              "MD033": false,
              "MD041": false
            }
